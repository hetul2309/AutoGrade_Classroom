[project]
name = "notebook-grader-backend"
version = "0.1.0"
description = "Automated notebook grading system for ML lab assignments"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Auth
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    # Config / env
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # LLM (Phase 4+)
    "anthropic>=0.40.0",
    # Notebook processing (Phase 2+)
    "nbformat>=5.10.0",
    # Orchestration (Phase 5+)
    "langgraph>=0.2.0",
    "google-genai>=2.21.0",
    "google-auth>=2.0.0",
    "cloudinary>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
